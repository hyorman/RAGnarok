name: Release gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:models
      - run: npm run test:fast

  native-process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run compile:tests:all
      - run: npm run test:core:compiled
      - run: npm run test:mcp:compiled
      - run: npm run test:shutdown-soak

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run compile:tests
      - run: xvfb-run -a npm run test:vscode:compiled

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pack
      - run: npm run verify:models
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-all-platforms
          path: "*.vsix"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/mcp-server/Dockerfile -t ragnarok-mcp:ci .
      - run: test "$(docker image inspect ragnarok-mcp:ci --format '{{.Config.User}}')" = node
      - run: docker volume create ragnarok-ci-data
      - run: >-
          docker run -d --name ragnarok-ci -p 4000:4000
          -v ragnarok-ci-data:/data/ragnarok
          -e RAGNAROK_API_KEY=ci-read-token
          -e RAGNAROK_WRITE_API_KEY=ci-write-token
          -e RAGNAROK_CORS_ORIGIN=https://ci.example
          ragnarok-mcp:ci
      - run: |
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:4000/ready && exit 0
            sleep 1
          done
          exit 1
      - run: RAGNAROK_API_KEY=ci-read-token RAGNAROK_WRITE_API_KEY=ci-write-token node scripts/docker-smoke.mjs create
      - run: docker stop -t 10 ragnarok-ci
      - run: test "$(docker inspect ragnarok-ci --format '{{.State.ExitCode}}')" = 0
      - run: docker start ragnarok-ci
      - run: |
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:4000/ready && exit 0
            sleep 1
          done
          exit 1
      - run: RAGNAROK_API_KEY=ci-read-token node scripts/docker-smoke.mjs verify
      - run: docker stop -t 10 ragnarok-ci
      - run: test "$(docker inspect ragnarok-ci --format '{{.State.ExitCode}}')" = 0
      - if: always()
        run: docker rm -f ragnarok-ci || true
      - if: always()
        run: docker volume rm ragnarok-ci-data || true
