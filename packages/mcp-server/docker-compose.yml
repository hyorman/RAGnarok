services:
  ragnarok-mcp:
    build:
      context: ../..
      dockerfile: packages/mcp-server/Dockerfile
    ports:
      - "${RAGNAROK_PORT:-4000}:4000"
    volumes:
      - ${RAGNAROK_HOST_STORAGE_DIR:-ragnarok-data}:/data/ragnarok
    environment:
      - RAGNAROK_PORT=4000
      - RAGNAROK_STORAGE_DIR=/data/ragnarok
      - RAGNAROK_HTTP_HOST=0.0.0.0
      - RAGNAROK_API_KEY=${RAGNAROK_API_KEY:?RAGNAROK_API_KEY is required}
      - RAGNAROK_WRITE_API_KEY=${RAGNAROK_WRITE_API_KEY:-}
      - RAGNAROK_LLM_PROVIDER=${RAGNAROK_LLM_PROVIDER:-none}
      - RAGNAROK_LLM_API_KEY=${RAGNAROK_LLM_API_KEY:-}
      - RAGNAROK_LLM_MODEL=${RAGNAROK_LLM_MODEL:-}
      - RAGNAROK_LLM_BASE_URL=${RAGNAROK_LLM_BASE_URL:-}
      - RAGNAROK_EMBEDDING_MODEL=${RAGNAROK_EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      - RAGNAROK_EMBEDDING_PROVIDER=${RAGNAROK_EMBEDDING_PROVIDER:-huggingface}
      - RAGNAROK_EMBEDDING_BASE_URL=${RAGNAROK_EMBEDDING_BASE_URL:-}
      - RAGNAROK_EMBEDDING_API_KEY=${RAGNAROK_EMBEDDING_API_KEY:-}
      - RAGNAROK_LANGGRAPH_ENABLED=${RAGNAROK_LANGGRAPH_ENABLED:-false}
      - RAGNAROK_QUERY_MEMORY_ENABLED=${RAGNAROK_QUERY_MEMORY_ENABLED:-false}
      - RAGNAROK_RERANKER_ENABLED=${RAGNAROK_RERANKER_ENABLED:-true}
      - RAGNAROK_RERANKER_MODEL=${RAGNAROK_RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      - RAGNAROK_SESSION_IDLE_TTL_MS=${RAGNAROK_SESSION_IDLE_TTL_MS:-1800000}
      - RAGNAROK_MAX_SESSIONS=${RAGNAROK_MAX_SESSIONS:-100}
      - RAGNAROK_RATE_LIMIT_PER_MINUTE=${RAGNAROK_RATE_LIMIT_PER_MINUTE:-120}
      - RAGNAROK_EXPORT_DIR=${RAGNAROK_EXPORT_DIR:-/data/ragnarok/exports}
      - RAGNAROK_GITHUB_HOSTS=${RAGNAROK_GITHUB_HOSTS:-github.com}
      - RAGNAROK_GITHUB_TOKEN=${RAGNAROK_GITHUB_TOKEN:-}
      - RAGNAROK_CHECKPOINT_RETENTION_MS=${RAGNAROK_CHECKPOINT_RETENTION_MS:-0}
      - RAGNAROK_CORS_ORIGIN=${RAGNAROK_CORS_ORIGIN:?RAGNAROK_CORS_ORIGIN is required}
      - RAGNAROK_LOG_LEVEL=${RAGNAROK_LOG_LEVEL:-info}
    restart: unless-stopped

volumes:
  ragnarok-data:
